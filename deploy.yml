kind: Deployment
apiVersion: apps/v1

metadata:
  name: python-deployment
  namespace: python-django
  labels:
    app: python-django

spec:
  replicas: 3
  selector:
    matchLabels:
      app: python-django
  template:
    metadata:
      labels:
        app: python-django
    spec:
      containers:
        - name: python-todo
          image:  gautam4424/django_app:latest
          ports:
            - containerPort: 8000
